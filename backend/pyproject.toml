[project]
name = "tracemind"
version = "0.1.0"
description = "Local-first RAG workbench with citation tracing and evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "pymilvus>=2.6,<2.7",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "rank-bm25>=0.2.2,<1",
  "numpy>=2,<3",
  "pymupdf>=1.26,<2",
  "anthropic<2",
  "cryptography>=50.0.1",
  "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# FastAPI explicitly supports dependency declarations as defaults.
ignore = ["B008"]
